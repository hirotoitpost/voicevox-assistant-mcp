[project]
name = "voicevox-assistant-mcp"
version = "0.1.0"
description = "VOICEVOX voice assistant for Claude Code: spoken summaries of replies (MCP server) and progress fillers (hooks)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "mcp>=2.1.1",
]

[project.scripts]
voicevox-assistant-mcp = "voicevox_assistant.server:main"
voicevox-assistant-hook = "voicevox_assistant.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicevox_assistant"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
